<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background border-b border-outline-variant z-40">
<div class="flex justify-between items-center px-margin-mobile py-sm w-full">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A polished, professional close-up portrait of a young adult looking forward with a slight, confident smile, set against a clean, softly lit light-gray studio background, capturing a modern corporate headshot aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9E8JQC1oPE_0nL5Z9zAxJiARENkhQpGvC4cxLKvt6p2RZR816W0PibG2aArAbX4_6Y_o_RHB2gpbRJ6gpiH-j6PtZ4JYEGnUl3ryNjIU2q_RwomB-4Htb4uC6cOFZ8cSxsmxfiOs5sbDB1P6cUmFCvNusoMar9wqQlMAVn57d4cGigll0oI9oWss42lcMDXbyxRj3T_o8OAVQM6hr7pmIBQnKD9lxk1r-JMrKkMO_akju2mfOXUMiUQ"/>

<h1 class="font-display text-h1-mobile font-bold text-primary">Lingora</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-md pb-xl">
<!-- Summary Chips -->
<section class="flex gap-md mb-lg">
<div class="flex-1 bg-surface-container rounded-xl p-md border border-outline-variant flex flex-col items-start justify-center">
<span class="font-caption text-caption text-on-surface-variant mb-xs">Total Words</span>
<div class="flex items-end gap-sm">
<span class="font-h1-mobile text-h1-mobile text-primary">312</span>
</div>
</div>
<div class="flex-1 bg-secondary-container bg-opacity-20 rounded-xl p-md border border-secondary-fixed-dim flex flex-col items-start justify-center relative overflow-hidden">
<div class="absolute right-[-10px] top-[-10px] opacity-10">
<span class="material-symbols-outlined text-[64px] text-secondary">notifications_active</span>
</div>
<span class="font-caption text-caption text-on-surface-variant mb-xs">Due for Review</span>
<div class="flex items-end gap-sm">
<span class="font-h1-mobile text-h1-mobile text-secondary">18</span>
</div>
</div>
</section>
<!-- Review Categories -->
<section class="mb-lg">
<h2 class="font-h2 text-h2-mobile text-on-surface mb-md">Review Decks</h2>
<div class="grid grid-cols-2 gap-sm">
<!-- Deck 1 -->
<button class="bg-surface rounded-[14px] p-md border border-outline-variant text-left hover:bg-surface-container-low active:scale-95 transition-all duration-200 flex flex-col h-32 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-primary mb-auto" data-weight="fill">favorite</span>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Common Verbs</h3>
<p class="font-caption text-caption text-on-surface-variant">42 words</p>
</div>
</button>
<!-- Deck 2 -->
<button class="bg-surface rounded-[14px] p-md border border-outline-variant text-left hover:bg-surface-container-low active:scale-95 transition-all duration-200 flex flex-col h-32 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-primary mb-auto" data-weight="fill">restaurant</span>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Food &amp; Dining</h3>
<p class="font-caption text-caption text-on-surface-variant">15 words</p>
</div>
</button>
<!-- Deck 3 -->
<button class="bg-surface rounded-[14px] p-md border border-outline-variant text-left hover:bg-surface-container-low active:scale-95 transition-all duration-200 flex flex-col h-32 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-primary mb-auto" data-weight="fill">flight_takeoff</span>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Travel Essentials</h3>
<p class="font-caption text-caption text-on-surface-variant">28 words</p>
</div>
</button>
<!-- Start Review CTA -->
<button class="bg-primary rounded-[14px] p-md border border-primary text-left hover:bg-primary/90 active:scale-95 transition-all duration-200 flex flex-col h-32 items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px] mb-xs">play_circle</span>
<h3 class="font-label-md text-label-md text-on-primary">Start Review</h3>
</button>
</div>
</section>
<!-- Recently Added List -->

<div class="flex justify-between items-center mb-md">
<h2 class="font-h2 text-h2-mobile text-on-surface">Recently Added</h2>
<button class="font-label-md text-label-md text-primary">See All</button>
</div>
<div class="flex flex-col gap-unit">
<!-- Word 1 -->
<div class="bg-surface rounded-xl p-md border border-outline-variant flex items-center justify-between">
<div>
<h4 class="font-body-lg text-body-lg text-on-surface font-semibold">Desayuno</h4>
<p class="font-body-md text-body-md text-on-surface-variant">Breakfast</p>

<div class="flex gap-xs text-primary">
<span class="material-symbols-outlined text-[16px]" data-weight="fill">star</span>
<span class="material-symbols-outlined text-[16px]">star</span>
<span class="material-symbols-outlined text-[16px]">star</span>
</div>
</div>
<!-- Word 2 -->
<div class="bg-surface rounded-xl p-md border border-outline-variant flex items-center justify-between">

<span class="material-symbols-outlined text-[16px]" data-weight="fill">star</span>
<span class="material-symbols-outlined text-[16px]">star</span>
</div>
</div>

<div class="bg-surface rounded-xl p-md border border-outline-variant flex items-center justify-between">
<div>
<h4 class="font-body-lg text-body-lg text-on-surface font-semibold">Desarrollo</h4>
<p class="font-body-md text-body-md text-on-surface-variant">Development</p>
</div>
<div class="flex gap-xs text-outline-variant">
<span class="material-symbols-outlined text-[16px]">star</span>
<span class="material-symbols-outlined text-[16px]">star</span>
<span class="material-symbols-outlined text-[16px]">star</span>

<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>

<span class="material-symbols-outlined mb-1">school</span>
<span class="font-label-md text-label-md">Learn</span>
</button>
