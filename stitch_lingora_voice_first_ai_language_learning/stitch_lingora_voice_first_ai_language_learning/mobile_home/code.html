<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-orb {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(252, 105, 89, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(252, 105, 89, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(252, 105, 89, 0); }
        }
        .animate-orb {
            animation: pulse-orb 2.5s infinite;
        }
    </style>

<body class="bg-background text-on-surface font-body-md min-h-screen pb-[100px] antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background dark:bg-background border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile py-sm w-full">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant flex items-center justify-center">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A close-up, high-key portrait of a young person smiling softly in a brightly lit, modern environment. The lighting is soft and pristine white, emphasizing a clean, approachable aesthetic suitable for a language learning app profile picture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6WK8NEkgEvRnv0zQ62uJfUniNF30wLf2BR4HNQBT06oPt7jyIsb3kezrlcrhAcXKqqQMtcKiC3M1bVMe65Sb7V8LErhaD68nf0mzkD3k5-Uhx5wo432CdC2fij2D8X5JalMlSh9ALK9JH71YpZVRL0qeO2gdOgoMg47VQvWzsM_-WRSxR8iW8crKqMMG6_GtzlaX80Wvz9X7nW-zNdExurHmLp11WC20dIm6mahtPmsUR_8qrGALchw"/>
</div>
<h1 class="font-display text-h2-mobile font-bold text-primary dark:text-primary-fixed-dim text-center absolute left-1/2 -translate-x-1/2">
            Lingora
        </h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-dim transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[24px]">settings</span>
</button>
</header>
<main class="flex flex-col gap-xl pt-lg">
<!-- Welcome Message -->
<section class="px-margin-mobile flex flex-col gap-xs">
<p class="font-body-lg text-body-lg text-on-surface-variant">Good morning, Alex 👋</p>
<h2 class="font-h1-mobile text-h1-mobile text-on-surface">Ready to chat?</h2>
</section>
<!-- Hero Card (Orb) -->
<section class="px-margin-mobile">
<div class="bg-surface-container-low border border-primary-fixed rounded-2xl p-xl flex flex-col items-center justify-center gap-lg relative overflow-hidden shadow-sm">
<!-- Subtle glassmorphism background glow -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-primary/5 pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center gap-md">
<button aria-label="Start Voice Conversation" class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-secondary-container flex items-center justify-center animate-orb transition-transform active:scale-95 cursor-pointer shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-low">
<span class="material-symbols-outlined text-white text-[40px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<p class="font-label-md text-label-md text-on-surface text-center opacity-90 tracking-wide uppercase">Tap to Speak</p>
</div>
</div>
</section>
<!-- Mini Stats Scroll -->
<section>
<div class="flex gap-md overflow-x-auto px-margin-mobile hide-scrollbar snap-x pb-sm">
<!-- Streak -->
<div class="bg-surface border border-outline-variant rounded-xl p-md min-w-[120px] snap-start flex flex-col gap-xs shadow-sm">
<div class="flex items-center gap-xs text-secondary-container">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-h2 text-h2 text-on-surface">12</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Day Streak</span>
</div>
<!-- Words -->
<div class="bg-surface border border-outline-variant rounded-xl p-md min-w-[120px] snap-start flex flex-col gap-xs shadow-sm">
<div class="flex items-center gap-xs text-tertiary-container">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">library_add_check</span>
<span class="font-h2 text-h2 text-on-surface">450</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Words Mastered</span>
</div>
<!-- XP -->
<div class="bg-surface border border-outline-variant rounded-xl p-md min-w-[120px] snap-start flex flex-col gap-xs shadow-sm">
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-h2 text-h2 text-on-surface">2.4k</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Total XP</span>
</div>
</div>
</section>
<!-- Today's Plan -->
<section class="px-margin-mobile flex flex-col gap-md">
<h3 class="font-h2-mobile text-h2-mobile text-on-surface">Today's Plan</h3>
<button class="w-full text-left bg-surface border border-outline-variant rounded-2xl p-md flex flex-col gap-md shadow-sm active:scale-[0.98] transition-transform duration-200 group hover:border-primary-fixed">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col gap-xs">
<span class="font-caption text-caption text-primary uppercase tracking-widest font-semibold">Featured Lesson</span>
<h4 class="font-h2 text-h2 text-on-surface group-hover:text-primary transition-colors">Past Simple in Real Life</h4>
</div>
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[24px]">play_arrow</span>
</div>
</div>
<div class="w-full flex flex-col gap-xs mt-sm">
<div class="flex justify-between items-center w-full">
<span class="font-caption text-caption text-on-surface-variant">60% Complete</span>
<span class="font-caption text-caption text-on-surface-variant">10 mins left</span>
</div>
<div class="w-full h-2 rounded-full bg-surface-container-high overflow-hidden">
<div class="h-full bg-primary rounded-full w-[60%]"></div>
</div>
</div>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline shadow-sm">
<div class="flex justify-around items-center px-4 pb-4 pt-2 w-full">
<!-- Active Tab: Home -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-4 py-1 active:scale-90 duration-150 group">
<span class="material-symbols-outlined text-[24px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<!-- Inactive Tab: Learn -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-all active:scale-90 duration-150 group">
<span class="material-symbols-outlined text-[24px]">school</span>
<span class="font-label-md text-label-md mt-1">Learn</span>
</button>
<!-- Inactive Tab: Vocab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-all active:scale-90 duration-150 group">
<span class="material-symbols-outlined text-[24px]">menu_book</span>
<span class="font-label-md text-label-md mt-1">Vocab</span>
</button>
<!-- Inactive Tab: Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-all active:scale-90 duration-150 group">
<span class="material-symbols-outlined text-[24px]">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</button>
</div>
</nav>
</body></html>
