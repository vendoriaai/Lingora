<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lingora - Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "on-background": "#131b2e",
                        "on-tertiary-container": "#e4d4ff",
                        "inverse-primary": "#c3c0ff",
                        "secondary-container": "#fc6959",
                        "on-primary-fixed-variant": "#3323cc",
                        "inverse-on-surface": "#eef0ff",
                        "background": "#faf8ff",

                        "secondary": "#ae3026",
                        "secondary-fixed": "#ffdad5",
                        "on-primary-container": "#dad7ff",
                        "surface-container-low": "#f2f3ff",
                        "surface-variant": "#dae2fd",

                    "spacing": {

                    },
                    "fontFamily": {
                        "body-md": ["Inter"],

                }
            }

<style>
        .pulse-anim {
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden">
<!-- Header Gradient Band -->
<div class="h-[160px] w-full bg-gradient-to-br from-[#4F46E5] to-[#7C3AED] flex flex-col items-center justify-center relative overflow-hidden rounded-b-[32px] shrink-0">
<!-- Decorative subtle pattern overlay could go here -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.1),transparent_50%)]"></div>
<div class="flex items-center gap-2 z-10">
<span class="material-symbols-outlined text-white text-[32px] pulse-anim" style="font-variation-settings: 'FILL' 1;">
                graphic_eq
            </span>
<h1 class="font-display text-white text-[36px] tracking-tight font-extrabold leading-none">Lingora</h1>
</div>
</div>
<!-- Main Content Area - Form Card -->
<main class="flex-1 w-full px-margin-mobile -mt-xl relative z-20 pb-xl">
<div class="bg-surface-container-lowest rounded-[24px] p-lg border border-outline-variant/30 shadow-[0_10px_40px_rgba(15,23,42,0.08)]">
<h2 class="font-h1-mobile text-h1-mobile text-center text-on-surface mb-lg">Welcome back</h2>
<!-- Tabs -->
<div class="flex bg-surface-container p-unit rounded-xl mb-lg relative">
<button aria-selected="true" class="flex-1 py-2 text-center rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md shadow-sm transition-all relative z-10">
                    Sign in
                </button>
<button aria-selected="false" class="flex-1 py-2 text-center rounded-lg text-on-surface-variant font-label-md text-label-md transition-all hover:text-on-surface">
                    Create account
                </button>
</div>
<!-- Standard Form -->
<form class="space-y-md mb-lg">
<div class="space-y-unit">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low border-none rounded-[10px] pl-xl pr-sm py-3 text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container focus:outline-none transition-shadow" id="email" placeholder="alex@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-unit">
<div class="flex justify-between items-center ml-1 pr-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-[10px] pl-xl pr-xl py-3 text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container focus:outline-none transition-shadow" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors p-1" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3.5 rounded-[10px] hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-md" type="submit">
                    Continue
                </button>
</form>
<div class="relative flex items-center py-sm mb-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-md font-caption text-caption text-on-surface-variant">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Auth -->
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md py-3 rounded-[10px] hover:bg-surface-container-low active:bg-surface-container transition-colors flex items-center justify-center gap-3">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.86C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.05H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.95l3.66-2.86z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.86c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
</main>
</body></html>
