<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lingora Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#e4d4ff",
                        "on-surface": "#131b2e",
                        "on-primary-fixed": "#0f0069",
                        "inverse-surface": "#283044",
                        "secondary-container": "#fc6959",
                        "surface-container-low": "#f2f3ff",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "inverse-primary": "#c3c0ff",
                        "surface-container-high": "#e2e7ff",
                        "on-secondary-fixed-variant": "#8c1712",
                        "surface-container-highest": "#dae2fd",
                        "tertiary-container": "#7531e6",
                        "tertiary": "#5c00ca",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-bright": "#faf8ff",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "on-secondary-container": "#690003",
                        "outline-variant": "#c7c4d8",
                        "on-primary-container": "#dad7ff",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#ffdad5",
                        "background": "#faf8ff",
                        "on-error": "#ffffff",
                        "surface-variant": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d2d9f4",
                        "surface": "#faf8ff",
                        "surface-tint": "#4d44e3",
                        "inverse-on-surface": "#eef0ff",
                        "outline": "#777587",
                        "tertiary-fixed-dim": "#d2bbff",
                        "primary": "#3525cd",
                        "on-tertiary-fixed": "#25005a",
                        "error-container": "#ffdad6",
                        "secondary": "#ae3026",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#464555",
                        "primary-container": "#4f46e5",
                        "on-background": "#131b2e",
                        "on-secondary-fixed": "#410001",
                        "surface-container": "#eaedff",
                        "on-primary-fixed-variant": "#3323cc",
                        "secondary-fixed-dim": "#ffb4aa",
                        "tertiary-fixed": "#eaddff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "xl": "48px",
                        "xs": "4px",
                        "sm": "8px",
                        "gutter": "20px",
                        "lg": "24px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "h2": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "h1-mobile": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "h1": ["Plus Jakarta Sans"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h1-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "h1": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md">
<!-- Container -->
<div class="w-full max-w-[560px] mx-auto min-h-screen md:min-h-[auto] flex flex-col justify-between bg-surface-container-lowest md:border md:border-outline-variant/30 md:rounded-xl relative shadow-none md:shadow-[0_10px_30px_rgba(15,23,42,0.05)]">
<!-- Header -->
<div class="flex items-center justify-between p-lg md:p-xl">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors" data-icon="arrow_back" style="font-variation-settings: 'wght' 300">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<div class="h-2 w-8 bg-primary rounded-full transition-all"></div>
<div class="h-2 w-2 bg-surface-variant rounded-full transition-all"></div>
<div class="h-2 w-2 bg-surface-variant rounded-full transition-all"></div>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors h-10 px-4 rounded-full hover:bg-primary-container/10 active:scale-95">
                Skip
            </button>
</div>
<!-- Content Area -->
<div class="flex-grow flex flex-col p-lg md:px-xl md:py-8 space-y-xl">
<!-- Step Titles -->
<div class="space-y-sm">
<h1 class="font-h1-mobile text-h1-mobile md:font-h1 md:text-h1 text-on-surface">Let's make your tutor feel like yours.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Three quick picks. You can change them anytime.</p>
</div>
<!-- Form Groups -->
<div class="space-y-lg flex-grow">
<!-- Language Selection -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface-variant">I want to learn</label>
<div class="flex flex-wrap gap-sm">
<button class="px-6 py-3 rounded-full border border-primary bg-primary-container/10 text-primary font-label-md text-label-md transition-all active:scale-95 flex items-center gap-2">
<span>Spanish</span>
</button>
<button class="px-6 py-3 rounded-full border border-outline-variant hover:border-primary/50 text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95">
                            English
                        </button>
<button class="px-6 py-3 rounded-full border border-outline-variant hover:border-primary/50 text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95">
                            French
                        </button>
</div>
</div>
<!-- Username -->
<div class="space-y-md relative">
<label class="font-label-md text-label-md text-on-surface-variant block">What should we call you?</label>
<div class="relative">
<input class="w-full h-14 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 px-4 font-body-lg text-body-lg text-on-surface placeholder-outline transition-all" placeholder="Enter username" type="text" value="Alex"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 bg-surface-container-high px-3 py-1 rounded-full flex items-center gap-1 border border-outline-variant/50">
<span class="material-symbols-outlined text-[14px] text-tertiary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1">check_circle</span>
<span class="font-caption text-caption text-on-surface-variant">Available</span>
</div>
</div>
</div>
<!-- Daily Goal -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface-variant">Daily practice goal</label>
<div class="grid grid-cols-4 gap-sm">
<button class="py-3 rounded-lg border border-outline-variant hover:border-primary/50 text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95">
                            5 min
                        </button>
<button class="py-3 rounded-lg border-2 border-primary bg-primary-container/10 text-primary font-label-md text-label-md transition-all active:scale-95">
                            15 min
                        </button>
<button class="py-3 rounded-lg border border-outline-variant hover:border-primary/50 text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95">
                            30 min
                        </button>
<button class="py-3 rounded-lg border border-outline-variant hover:border-primary/50 text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95">
                            60 min
                        </button>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="p-lg md:p-xl flex justify-end items-center border-t border-outline-variant/30 mt-auto md:mt-0 bg-surface-container-lowest rounded-b-xl relative z-10">
<button class="bg-primary hover:bg-primary-fixed-variant text-on-primary px-8 h-12 rounded-lg font-label-md text-label-md transition-all active:scale-95 flex items-center gap-2 shadow-[0_4px_14px_rgba(53,37,205,0.2)]">
                Continue
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</body></html>
